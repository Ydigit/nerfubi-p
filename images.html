<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NERFUBI – Comparação de Imagens</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>NERFUBI</h1>
            <p class="subtitle">Comparação de Imagens dos Modelos</p>
        </div>
        <nav>
            <a href="index.html">Voltar</a>
        </nav>
    </header>
    <main>
        <h2>Comparação de Imagens</h2>
        <div class="comparison-table">
            <!-- Exemplo de linha de comparação -->
            <div class="comparison-row">
                <div>
                    <img src="images/nerfacto-cena1.png" alt="Nerfacto Cena 1">
                    <p>Nerfacto</p>
                </div>
                <div>
                    <img src="images/instant-ngp-cena1.png" alt="Instant-NGP Cena 1">
                    <p>Instant-NGP</p>
                </div>
                <div>
                    <img src="images/nerfsh-cena1.png" alt="NeRF-SH Cena 1">
                    <p>NeRF-SH</p>
                </div>
                <div class="cen-label">
                    <p>Cena 1</p>
                </div>
            </div>
            <!-- Repete para cada cena -->
            <div class="comparison-row">
                <div>
                    <img src="images/nerfacto-cena2.png" alt="Nerfacto Cena 2">
                    <p>Nerfacto</p>
                </div>
                <div>
                    <img src="images/instant-ngp-cena2.png" alt="Instant-NGP Cena 2">
                    <p>Instant-NGP</p>
                </div>
                <div>
                    <img src="images/nerfsh-cena2.png" alt="NeRF-SH Cena 2">
                    <p>NeRF-SH</p>
                </div>
                <div class="cen-label">
                    <p>Cena 2</p>
                </div>
            </div>
            <!-- Adiciona mais linhas conforme necessário -->
        </div>
    </main>
</body>
</html>
